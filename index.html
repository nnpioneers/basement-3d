<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>3D Real Estate Masterplan | Interactive Layout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        background-color: #0d0f12;
        color: #ffffff;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* Instant High-Performance Inline Loader */
      .initial-loader-wrap {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #181c24 0%, #0d0f12 100%);
      }
      .loader-glow {
        position: absolute;
        width: 320px;
        height: 320px;
        background: radial-gradient(circle, rgba(240, 192, 16, 0.12) 0%, rgba(240, 192, 16, 0) 70%);
        border-radius: 50%;
        animation: pulseGlow 3s ease-in-out infinite alternate;
        pointer-events: none;
      }
      .loader-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 36px 44px;
        background: rgba(22, 26, 33, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        max-width: 90vw;
        width: 420px;
        text-align: center;
      }
      .loader-ring-box {
        position: relative;
        width: 68px;
        height: 68px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .spinner-ring {
        position: absolute;
        inset: 0;
        border: 3px solid rgba(240, 192, 16, 0.15);
        border-top: 3px solid #f0c010;
        border-right: 3px solid #f0c010;
        border-radius: 50%;
        animation: spinRing 0.9s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      }
      .loader-icon {
        width: 28px;
        height: 28px;
        color: #f0c010;
      }
      .loader-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ffffff;
        margin-bottom: 6px;
      }
      .loader-subtitle {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 24px;
        font-weight: 400;
      }
      .progress-track {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
        margin-bottom: 16px;
      }
      .progress-shimmer {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #f0c010 0%, #ffd700 50%, #f0c010 100%);
        border-radius: 10px;
        animation: loadingBar 1.8s ease-in-out infinite;
        transform-origin: left;
      }
      .status-line {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: rgba(240, 192, 16, 0.9);
        font-weight: 500;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        background-color: #f0c010;
        border-radius: 50%;
        box-shadow: 0 0 10px #f0c010;
        animation: blink 1.2s ease-in-out infinite alternate;
      }

      @keyframes spinRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0% { transform: scale(0.95); opacity: 0.6; }
        100% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes loadingBar {
        0% { transform: scaleX(0.05); }
        50% { transform: scaleX(0.65); }
        100% { transform: scaleX(0.95); }
      }
      @keyframes blink {
        0% { opacity: 0.3; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant loader rendered directly on page load before JS bundle downloads -->
      <div class="initial-loader-wrap">
        <div class="loader-glow"></div>
        <div class="loader-card">
          <div class="loader-ring-box">
            <div class="spinner-ring"></div>
            <svg class="loader-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21h18M3 10h18M3 7l9-4 9 4M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"/>
            </svg>
          </div>
          <h1 class="loader-title">3D REAL ESTATE MASTERPLAN</h1>
          <p class="loader-subtitle">Initializing 3D Environment & Layout...</p>
          <div class="progress-track">
            <div class="progress-shimmer"></div>
          </div>
          <div class="status-line">
            <span class="status-dot"></span> Loading 3D Engine & Assets
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
